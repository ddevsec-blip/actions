name: test-inputs
on: push
jobs:
  test-context:
    runs-on: ubuntu-latest
    steps:
      - name: using context variables
        run: |
          echo "this workflow triggered by ${{ github.actor}}"
          echo "the repo name is ${{  github.repository}}"
          echo " the branch name is ${{ github.ref_name}}"
          echo " test ${{github.ref}}"
      - name: print all variables
        run: 
          echo "${{toJson(github)}}"
      - name: print env variable
        run: printenv
